name: Yuna Environment Sync

on:
  workflow_dispatch:

jobs:
  sync-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Yuna environment variables
        uses: appleboy/ssh-action@v1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_SSH_KEY }}
          envs: CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_AI_TOKEN
          script: |
            echo "Connected to Yuna production host."
            echo "Cloudflare Account ID available: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo no)"
            echo "Cloudflare API token available: $([ -n "$CLOUDFLARE_AI_TOKEN" ] && echo yes || echo no)"
            echo "Yuna directory exists: $([ -d /root/Kumo ] && echo yes || echo no)"
